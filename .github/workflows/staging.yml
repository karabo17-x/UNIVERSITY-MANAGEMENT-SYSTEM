name: Staging Release

# Builds versioned binaries from the `develop` branch and publishes them
# as a GitHub pre-release, tagged e.g. staging-v1.<run_number>.
# Treat these as "staging" builds: good for testing, not for end users.

on:
  push:
    branches: ["develop"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: university_system
            package_name: university-management-system-linux
          - os: windows-latest
            artifact_name: university_system.exe
            package_name: university-management-system-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          modules: "qtbase"

      - name: Configure (CMake) - Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build - Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release -j 2

      - name: Package - Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/${{ matrix.artifact_name }} dist/
          tar -czf ${{ matrix.package_name }}.tar.gz -C dist .

      - name: Configure (CMake) - Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022"

      - name: Build - Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Package - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build/Release/${{ matrix.artifact_name }}" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: |
            ${{ matrix.package_name }}.tar.gz
            ${{ matrix.package_name }}.zip
          if-no-files-found: ignore

  publish-staging-release:
    name: Publish staging pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create staging tag
        id: tag
        run: echo "tag=staging-v1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Staging build ${{ steps.tag.outputs.tag }}"
          body: |
            Automated staging build from `develop` @ ${{ github.sha }}.
            Not for production use.
          prerelease: true
          files: release-files/*