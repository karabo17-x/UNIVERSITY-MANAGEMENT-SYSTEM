name: CI

# Fast build check on every push and pull request, to any branch.
# This is the gate that staging/production releases implicitly rely on:
# if this fails, the later release workflows won't have anything good to ship.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-linux:
    name: Build (Linux, Qt6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          modules: "qtbase"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Smoke-check binary exists
        run: test -f build/university_system

  build-windows:
    name: Build (Windows, Qt6)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          modules: "qtbase"

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke-check binary exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build/Release/university_system.exe")) {
            Write-Error "Expected binary not found"
            exit 1
          }